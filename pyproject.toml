[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langmine"
version = "1.6.0"
description = "YouTube sentence mining for language learning"
readme = "PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    # Transcripts via yt-dlp --write-sub (no separate library needed)
    "jieba",
    "pypinyin",
    "flask",
    "pyyaml",
    "deep-translator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
langmine = "langmine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
