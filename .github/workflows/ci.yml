name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Fast checks on every push ──────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install frontend deps
        run: |
          cd src/langmine/web/frontend
          npm ci

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Build frontend
        run: |
          cd src/langmine/web/frontend
          npm run build

      - name: Frontend Quality Gate (Fallow)
        run: |
          cd src/langmine/web/frontend
          npx fallow audit --base origin/main

      - name: Python Complexity (Radon CC)
        run: |
          radon cc -s -a src/ --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          bad = sum(1 for v in d.values() for f in v if f['rank'] in 'CDEF')
          if bad:
              print(f'{bad} functions with C-or-worse complexity — see radon report above')
              sys.exit(1)
          print('All functions at B or better')
          "

      - name: Python Maintainability (Radon MI)
        run: |
          radon mi src/ --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          bad = [k for k, v in d.items() if v['rank'] == 'C']
          if bad:
              for f in bad:
                  print(f'  {f}: MI rank C')
              sys.exit(1)
          print('All files at B or better')
          "

      - name: Python Dead Code (Coverage + Vulture)
        run: |
          coverage run -m pytest tests/ -q --ignore=tests/test_audio.py --ignore=tests/test_pipeline.py
          vulture src/ --min-confidence 80

  # ── E2E tests on PRs only ──────────────────────────────────────────────
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install frontend + Playwright
        run: |
          cd src/langmine/web/frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd src/langmine/web/frontend
          npm run build

      - name: Run Playwright E2E tests
        run: |
          cd src/langmine/web/frontend
          npx playwright test
