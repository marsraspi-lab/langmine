repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: architecture-checks
        name: Architecture Checks (AST-based)
        entry: bash -c "python -m pytest tests/test_architecture.py -v"
        language: system
        pass_filenames: false
        always_run: true

      - id: fast-tests
        name: Fast Test Suite (No I/O)
        entry: bash -c "python -m pytest tests/ -q --ignore=tests/test_audio.py --ignore=tests/test_pipeline.py"
        language: system
        pass_filenames: false
        always_run: true

      - id: python-dead-code
        name: Python Dead Code (Vulture) [advisory]
        entry: bash -c "vulture src/ --min-confidence 80 || true"
        language: system
        pass_filenames: false
        files: \\.py$

      - id: python-complexity
        name: Python Complexity (Radon CC) [advisory]
        entry: bash -c "radon cc -s -a src/ --json | python3 -c \"import sys,json; d=json.load(sys.stdin); bad=sum(1 for v in d.values() for f in v if f['rank'] in 'DEF'); sys.exit(1 if bad else 0)\" || true"
        language: system
        pass_filenames: false
        files: \\.py$

      - id: python-maintainability
        name: Python Maintainability (Radon MI) [advisory]
        entry: bash -c "radon mi src/ --json | python3 -c \"import sys,json; d=json.load(sys.stdin); bad=[k for k,v in d.items() if v['rank']=='C']; sys.exit(1 if bad else 0)\" || true"
        language: system
        pass_filenames: false
        files: \\.py$

      - id: frontend-format
        name: Frontend Formatting (Prettier)
        entry: bash -c "cd src/langmine/web/frontend && npm run format"
        language: system
        pass_filenames: false
        files: \\.(js|svelte|css|json|md)$

      - id: frontend-lint
        name: Frontend Lint (ESLint)
        entry: bash -c "cd src/langmine/web/frontend && npm run lint"
        language: system
        pass_filenames: false
        files: \\.(js|svelte)$

      - id: frontend-quality
        name: Frontend Quality Gate (Fallow)
        entry: bash -c "git diff --cached --name-only | grep -qE '\.(js|svelte)$' && git diff --cached | npx fallow audit --diff-stdin || true"
        language: system
        pass_filenames: false
        files: \\.(js|svelte)$
